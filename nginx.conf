server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Preserve nginx's full MIME table. This file is included inside the http{}
  # block, so a bare server-level types{} would REPLACE the inherited mappings
  # and serve JS/CSS/HTML as application/octet-stream (breaking ES module
  # scripts). Re-including mime.types at this level restores JS -> text/javascript,
  # CSS -> text/css, HTML -> text/html. nginx 1.27's bundled mime.types (see the
  # nginx:1.27-alpine base in Dockerfile) already maps `application/wasm wasm;`,
  # so .wasm is served correctly without a separate augmentation.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Optional cross-origin isolation -> SharedArrayBuffer -> multithreaded
  # AVIF/JXL/OxiPNG encode. This is a progressive enhancement only: the app
  # works correctly single-threaded when crossOriginIsolated === false, so
  # these headers are additive, never load-bearing. All assets are same-origin,
  # so require-corp does not break any request.
  add_header Cross-Origin-Opener-Policy   "same-origin"  always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin"  always;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  # Long-cache content-hashed build assets (Vite fingerprints JS/CSS/WASM).
  # add_header in a nested location REPLACES inherited headers, so the COOP/COEP
  # trio must be repeated here to keep isolation intact for these responses.
  location /assets/ {
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Never cache the service worker or HTML shell so PWA updates land promptly.
  location = /sw.js {
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback: serve index.html for client-side routed deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
